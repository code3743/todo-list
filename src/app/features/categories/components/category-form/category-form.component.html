<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="cancel()" (keydown.enter)="cancel()">Cancel</ion-button>
    </ion-buttons>
    <ion-title>{{ title }}</ion-title>
    <ion-buttons slot="end">
      <ion-button
        (click)="submit()"
        (keydown.enter)="submit()"
        [disabled]="form.invalid"
        strong="true"
      >Save</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form">
    <ion-item>
      <ion-input
        formControlName="name"
        label="Category name"
        labelPlacement="floating"
        placeholder="e.g. Work, Personal"
        autocomplete="off"
      ></ion-input>
    </ion-item>

    <div class="color-picker">
      <p class="color-picker__label">Color</p>
      <div class="color-picker__swatches">
        @for (color of colors; track color) {
          <button
            type="button"
            class="color-swatch"
            [class.selected]="form.value.color === color"
            [style.background-color]="color"
            (click)="selectColor(color)"
          ></button>
        }
      </div>
    </div>
  </form>
</ion-content>
