<ion-item-sliding>
  <ion-item>
    <ion-checkbox
      slot="start"
      [checked]="task().completed"
      (ionChange)="toggled.emit(task().id)"
    ></ion-checkbox>

    <ion-label [class.completed]="task().completed">
      {{ task().title }}
      @if (category()) {
        <p>
          <span class="category-badge" [style.background-color]="category()!.color">
            {{ category()!.name }}
          </span>
        </p>
      }
    </ion-label>
  </ion-item>

  <ion-item-options side="end">
    <ion-item-option color="danger" (click)="deleted.emit(task().id)" (keydown.enter)="deleted.emit(task().id)">
      <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
    </ion-item-option>
  </ion-item-options>
</ion-item-sliding>
